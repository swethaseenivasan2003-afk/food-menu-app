<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f8fa;
      color: #1a1a1a;
    }

    .header {
      background-color: #f4511e;
      padding: 48px 20px 40px;
      text-align: center;
      color: #ffffff;
    }

    .header h1 {
      font-size: 2.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .header .version {
      margin-top: 14px;
      font-size: 1.15rem;
      font-weight: 400;
      opacity: 0.95;
    }

    .menu-container {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-item {
      background-color: #ffffff;
      border-radius: 6px;
      padding: 28px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .menu-item .name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .menu-item .price {
      font-size: 1.4rem;
      font-weight: 500;
      color: #1a1a1a;
    }

    .footer {
      text-align: center;
      padding: 40px 20px 60px;
      color: #8a8f98;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>🍔 Food Delivery Menu</h1>
    <div class="version">Version: v2.0</div>
  </header>

  <main class="menu-container" id="menu-container">
    <!-- Menu items are injected by script.js -->
  </main>

  <footer class="footer">
    Food Menu Service &bull; CI/CD Demo
  </footer>

  <script src="script.js"></script>
</body>
</html>
